<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Editar Estudiante — Saber Pro & TYT</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#f0f6ff;--sidebar-bg:#ffffff;--topbar-bg:#ffffff;--surface:#ffffff;
      --surface2:#f0f6ff;--border:#dce8f8;--border-strong:#b8d4f5;
      --text:#07183a;--text-mid:#334155;--muted:#94a3b8;--sidebar-w:240px;
      --red:#b91c1c;--red-light:#fee2e2;--red-border:#fca5a5;
    }
    html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
    body{display:flex}

    /* SIDEBAR */
    .sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;box-shadow:4px 0 20px rgba(7,24,58,.06)}
    .sidebar-brand{padding:22px 20px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px}
    .brand-ico{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#07183a,#2563eb);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:.75rem;color:#fff}
    .brand-name{font-family:'Syne',sans-serif;font-weight:800;font-size:.9rem;color:#07183a;line-height:1.15}
    .brand-name span{color:#2563eb}
    .brand-tag{display:inline-block;margin-top:4px;font-size:.56rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,#8B1A1A,#c0392b);padding:2px 7px;border-radius:5px}
    .nav-section{font-size:.58rem;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);padding:18px 20px 6px}
    .nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;margin:2px 10px;border-radius:10px;font-size:.82rem;font-weight:500;color:var(--text-mid);text-decoration:none;transition:all .18s}
    .nav-item svg{width:16px;height:16px;flex-shrink:0;color:var(--muted)}
    .nav-item:hover{background:var(--red-light);color:var(--red);transform:translateX(2px)}
    .nav-item:hover svg{color:var(--red)}
    .nav-item.active{background:linear-gradient(135deg,#fee2e2,#fff1f2);color:var(--red);border:1px solid var(--red-border);font-weight:700}
    .nav-item.active svg{color:var(--red)}
    .sidebar-spacer{flex:1}
    .sidebar-user{margin:0 10px 6px;padding:12px 14px;border-radius:12px;background:linear-gradient(135deg,#f0f6ff,#dbeafe);border:1px solid var(--border);display:flex;align-items:center;gap:10px}
    .user-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#8B1A1A,#c0392b);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:.72rem;font-weight:800;color:#fff}
    .user-name{font-family:'Syne',sans-serif;font-size:.78rem;font-weight:700;color:#07183a}
    .user-role{font-size:.62rem;color:var(--muted);margin-top:1px}
    .logout-link{display:flex;align-items:center;gap:8px;padding:10px 24px;margin-bottom:14px;font-size:.75rem;color:var(--muted);text-decoration:none;transition:color .18s}
    .logout-link:hover{color:#ef4444}
    .logout-link svg{width:14px;height:14px}

    /* TOPBAR */
    .topbar{position:fixed;left:var(--sidebar-w);right:0;top:0;height:58px;background:var(--topbar-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 30px;z-index:40;box-shadow:0 2px 12px rgba(7,24,58,.05)}
    .topbar-left{display:flex;align-items:center;gap:14px}
    .page-chip{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:8px;background:var(--red-light);border:1px solid var(--red-border);font-size:.7rem;font-weight:700;color:var(--red)}
    .page-chip svg{width:13px;height:13px}
    .page-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1.05rem;color:#07183a}
    .page-sub{font-size:.74rem;color:var(--muted);margin-top:1px}
    .topbar-right{display:flex;align-items:center;gap:12px}
    .status-badge{display:flex;align-items:center;gap:7px;padding:6px 14px;border-radius:20px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);font-size:.7rem;font-weight:600;color:#059669}
    .status-dot{width:6px;height:6px;border-radius:50%;background:#10b981;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    .topbar-date{font-size:.72rem;color:var(--muted);padding:6px 12px;border-radius:8px;background:var(--surface2);border:1px solid var(--border)}

    /* MAIN */
    .main{margin-left:var(--sidebar-w);padding-top:58px;flex:1;overflow-y:auto;height:100%}
    .main::-webkit-scrollbar{width:5px}
    .main::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:5px}
    .content{padding:28px 30px;max-width:680px}

    /* EDIT CARD */
    .edit-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;animation:fadeUp .35s ease both;box-shadow:0 4px 20px rgba(7,24,58,.06)}
    .edit-card-header{
      background:linear-gradient(135deg,#5c0a0a,#8B1A1A,#c0392b);
      padding:28px 28px 24px;position:relative;overflow:hidden;
    }
    .edit-card-header::before{content:'';position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.05)}
    .edit-avatar{
      width:60px;height:60px;border-radius:50%;
      background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.3);
      display:flex;align-items:center;justify-content:center;
      font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:800;color:#fff;
      margin-bottom:12px;position:relative;z-index:1;
    }
    .edit-card-header h2{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;color:#fff;position:relative;z-index:1}
    .edit-card-header p{font-size:.74rem;color:rgba(255,255,255,.55);margin-top:3px;position:relative;z-index:1}

    .edit-card-body{padding:28px}
    .fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
    .field-full{grid-column:1/-1}
    .form-field{display:flex;flex-direction:column;gap:6px}
    .form-field label{font-size:.67rem;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
    .form-field input,.form-field select{
      padding:10px 13px;border-radius:10px;border:1px solid var(--border);
      background:var(--surface2);font-family:'DM Sans',sans-serif;font-size:.85rem;color:var(--text);
      transition:border .15s,box-shadow .15s;outline:none;
    }
    .form-field input:focus,.form-field select:focus{border-color:var(--red-border);box-shadow:0 0 0 3px rgba(185,28,28,.08)}
    .form-field input[readonly]{background:#f8fbff;color:var(--muted);cursor:not-allowed}

    .edit-actions{display:flex;gap:10px;justify-content:flex-end;padding-top:8px;border-top:1px solid var(--border)}
    .btn-cancel{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text-mid);font-family:'Syne',sans-serif;font-size:.78rem;font-weight:700;text-decoration:none;transition:all .18s}
    .btn-cancel:hover{border-color:var(--border-strong);background:var(--surface)}
    .btn-cancel svg{width:14px;height:14px}
    .btn-save{display:inline-flex;align-items:center;gap:7px;padding:10px 22px;border-radius:10px;border:none;cursor:pointer;background:linear-gradient(135deg,#8B1A1A,#c0392b);color:#fff;font-family:'Syne',sans-serif;font-size:.78rem;font-weight:700;transition:all .18s}
    .btn-save:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(139,26,26,.3)}
    .btn-save svg{width:14px;height:14px}

    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-ico">SP</div>
    <div>
      <div class="brand-name">Saber <span>Pro</span> &amp; TYT</div>
      <span class="brand-tag">Coordinador</span>
    </div>
  </div>
  <div class="nav-section">Principal</div>
  <a class="nav-item" href="/coordinador/dashboard">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
    </svg>
    Dashboard
  </a>
  <div class="nav-section">Gestión</div>
  <a class="nav-item active" href="/coordinador/estudiantes">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/>
      <path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>
    </svg>
    Estudiantes
  </a>
  <div class="nav-section">Informes</div>
  <a class="nav-item" href="/coordinador/informe-general">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
    </svg>
    Informe General
  </a>
  <a class="nav-item" href="/coordinador/informe-detallado">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <path d="M3 9h18M3 15h18M9 3v18"/>
    </svg>
    Informe Detallado
  </a>
  <a class="nav-item" href="/coordinador/informe-beneficios">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <polyline points="20 12 20 22 4 22 4 12"/>
      <rect x="2" y="7" width="20" height="5"/>
      <line x1="12" y1="22" x2="12" y2="7"/>
    </svg>
    Informe Beneficios
  </a>
  <div class="sidebar-spacer"></div>
  <div class="sidebar-user">
    <div class="user-av" th:text="${#strings.substring(usuario.nombre,0,1)}">C</div>
    <div>
      <div class="user-name" th:text="${usuario.nombre}">Coordinador</div>
      <div class="user-role">Coordinador</div>
    </div>
  </div>
  <a class="logout-link" href="/logout">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
      <polyline points="16 17 21 12 16 7"/>
      <line x1="21" y1="12" x2="9" y2="12"/>
    </svg>
    Cerrar sesión
  </a>
</aside>

<!-- TOPBAR -->
<header class="topbar">
  <div class="topbar-left">
    <div class="page-chip">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      Editar
    </div>
    <div>
      <div class="page-title">Editar Estudiante</div>
      <div class="page-sub">Modificar datos del estudiante</div>
    </div>
  </div>
  <div class="topbar-right">
    <div class="topbar-date" id="topbar-date"></div>
    <div class="status-badge"><div class="status-dot"></div><span>Conectado</span></div>
  </div>
</header>

<!-- MAIN -->
<main class="main">
  <div class="content">
    <div class="edit-card" th:if="${estudiante}">

      <!-- Header con avatar -->
      <div class="edit-card-header">
        <div class="edit-avatar" th:text="${#strings.substring(estudiante.nombre,0,1)}">E</div>
        <h2 th:text="${estudiante.nombre + ' ' + estudiante.apellido}">Nombre Estudiante</h2>
        <p th:text="${estudiante.correo}">correo@uts.edu.co</p>
      </div>

      <!-- Formulario -->
      <div class="edit-card-body">
        <form action="/coordinador/estudiantes/actualizar" method="post">
          <input type="hidden" name="id" th:value="${estudiante.id}">
          <div class="fields-grid">

            <div class="form-field">
              <label>Documento</label>
              <input type="text" th:value="${estudiante.documento}" readonly>
            </div>
            <div class="form-field">
              <label>Tipo Prueba</label>
              <select name="tipoPrueba">
                <option value="PRO" th:selected="${estudiante.tipoPrueba == 'PRO'}">PRO</option>
                <option value="TYT" th:selected="${estudiante.tipoPrueba == 'TYT'}">TYT</option>
              </select>
            </div>

            <div class="form-field">
              <label>Primer Nombre</label>
              <input type="text" name="nombre" th:value="${estudiante.nombre}" required>
            </div>
            <div class="form-field">
              <label>Primer Apellido</label>
              <input type="text" name="apellido" th:value="${estudiante.apellido}" required>
            </div>

            <div class="form-field">
              <label>Correo</label>
              <input type="email" name="correo" th:value="${estudiante.correo}" required>
            </div>
            <div class="form-field">
              <label>Teléfono</label>
              <input type="text" name="telefono" th:value="${estudiante.telefono}" required>
            </div>

            <div class="form-field field-full">
              <label>Programa</label>
              <select name="facultadId">
                <option th:each="f : ${facultades}"
                        th:value="${f.id}"
                        th:text="${f.nombre}"
                        th:selected="${f.id == estudiante.facultad.id}">
                </option>
              </select>
            </div>

          </div>

          <div class="edit-actions">
            <a href="/coordinador/estudiantes" class="btn-cancel">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
              Cancelar
            </a>
            <button type="submit" class="btn-save">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v14a2 2 0 01-2 2z"/>
                <polyline points="17 21 17 13 7 13 7 21"/>
                <polyline points="7 3 7 8 15 8"/>
              </svg>
              Actualizar Estudiante
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>

<script>
  const d = new Date();
  document.getElementById('topbar-date').textContent =
    d.toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
</script>
</body>
</html>
