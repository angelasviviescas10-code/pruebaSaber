<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saber Pro & TYT - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }

        body{
            font-family:'DM Sans',sans-serif;
            min-height:100vh;
            overflow:hidden;
            background:#07183a;
            display:flex;
            align-items:center;
            justify-content:space-between;
            position:relative;
        }

        /* FONDO */
        .bg-wrap{ position:fixed; inset:0; z-index:0; overflow:hidden; }

        .bg-blob{
            position:absolute; right:-10%; top:-10%;
            width:70%; height:120%;
            background:linear-gradient(135deg,#dceeff 0%,#8fc7ff 25%,#4e9fff 50%,#1d4ed8 75%,#07183a 100%);
            border-radius:42% 58% 60% 40% / 38% 42% 58% 62%;
            animation:morph 10s infinite alternate ease-in-out;
        }

        @keyframes morph{
            0%  { border-radius:42% 58% 60% 40% / 38% 42% 58% 62%; }
            50% { border-radius:60% 40% 40% 60% / 55% 35% 65% 45%; }
            100%{ border-radius:35% 65% 50% 50% / 45% 55% 45% 55%; }
        }

        .bg-glow{
            position:absolute; width:260px; height:260px;
            background:radial-gradient(circle,rgba(255,255,255,.25),transparent 70%);
            left:20%; top:30%;
            animation:float 6s infinite alternate ease-in-out;
        }

        @keyframes float{
            from{ transform:translateY(0px); }
            to  { transform:translateY(-25px); }
        }

        /* TOPBAR */
        .topbar{
            position:fixed; top:0; left:0; right:0;
            padding:22px 45px;
            display:flex; justify-content:flex-end; gap:25px;
            z-index:20;
        }
        .topbar a{
            text-decoration:none; color:rgba(255,255,255,.7);
            font-size:.78rem; font-weight:600; transition:.2s;
        }
        .topbar a:hover{ color:white; }
        .top-btn{
            padding:7px 18px; border-radius:10px;
            border:1px solid rgba(255,255,255,.3);
            background:rgba(255,255,255,.08); backdrop-filter:blur(10px);
        }

        /* PANEL LOGIN */
        .login-panel{
            position:relative; z-index:10;
            width:380px; margin-left:7vw;
            background:white; border-radius:25px;
            padding:35px 35px 30px;
            box-shadow:0 25px 80px rgba(0,0,0,.35);
            animation:show .6s ease;
            max-height:95vh; overflow-y:auto;
        }
        .login-panel::-webkit-scrollbar{ width:4px; }
        .login-panel::-webkit-scrollbar-thumb{ background:#dce8f8; border-radius:4px; }

        @keyframes show{
            from{ opacity:0; transform:translateY(30px); }
            to  { opacity:1; transform:translateY(0); }
        }

        /* BRAND */
        .brand{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
        .brand-icon{
            width:35px; height:35px; border-radius:10px;
            background:linear-gradient(135deg,#07183a,#2563eb);
            display:flex; align-items:center; justify-content:center;
            color:white; font-weight:bold;
        }
        .brand-name{ font-family:'Syne',sans-serif; font-weight:800; font-size:.95rem; color:#07183a; }
        .brand-name span{ color:#2563eb; }

        /* AVATAR */
        .avatar{
            width:65px; height:65px; border-radius:50%;
            margin:15px auto;
            background:#eef5ff; border:2px solid #dce8f8;
            display:flex; align-items:center; justify-content:center;
            font-size:1.7rem; font-weight:800; color:#2563eb; transition:.3s;
        }

        /* TITLES */
        .title{
            text-align:center; font-family:'Syne',sans-serif;
            font-size:1.4rem; font-weight:800; color:#07183a;
        }
        .subtitle{
            text-align:center; margin-top:4px; margin-bottom:20px;
            color:#94a3b8; font-size:.8rem;
        }

        /* ALERTAS */
        .alert{ padding:12px; border-radius:10px; margin-bottom:15px; font-size:.8rem; }
        .alert-error{ background:#fee2e2; color:#991b1b; border:1px solid #fecaca; }
        .alert-success{ background:#dcfce7; color:#166534; border:1px solid #bbf7d0; }

        /* INPUTS */
        .group{ margin-bottom:13px; }
        .group label{ display:block; margin-bottom:5px; font-size:.75rem; font-weight:700; color:#07183a; }

        .input-wrap{
            display:flex; align-items:center;
            border:1.5px solid #dce8f8; border-radius:12px;
            overflow:hidden; background:#f8fbff;
            transition:.2s;
        }
        .input-wrap:focus-within{ border-color:#2563eb; }

        .input-wrap input{
            width:100%; border:none; outline:none;
            background:transparent; padding:12px 13px; font-size:.9rem;
        }

        /* ojo contraseña */
        .eye-btn{
            background:none; border:none; cursor:pointer;
            padding:0 12px; color:#94a3b8; font-size:1rem;
            display:flex; align-items:center;
        }
        .eye-btn:hover{ color:#2563eb; }

        /* BOTON */
        .btn{
            width:100%; padding:13px; border:none; border-radius:12px;
            background:linear-gradient(135deg,#07183a,#2563eb);
            color:white; font-weight:700; font-size:.9rem;
            cursor:pointer; transition:.2s;
        }
        .btn:hover{ transform:translateY(-2px); opacity:.92; }

        /* DIVIDER */
        .divider{ display:flex; align-items:center; gap:10px; margin:18px 0 12px; }
        .divider-line{ flex:1; height:1px; background:#e2e8f0; }
        .divider-text{ font-size:.7rem; color:#94a3b8; font-weight:700; white-space:nowrap; }

        /* CHIPS — scroll horizontal */
        .users-scroll{
            overflow-x:auto;
            overflow-y:hidden;
            padding-bottom:6px;
        }
        .users-scroll::-webkit-scrollbar{ height:4px; }
        .users-scroll::-webkit-scrollbar-thumb{ background:#dce8f8; border-radius:4px; }

        .users-grid{
            display:flex;
            flex-wrap:nowrap;        /* una sola fila */
            gap:8px;
            width:max-content;       /* expansión natural */
        }

        .user-chip{
            display:flex; align-items:center; gap:7px;
            padding:6px 12px 6px 6px;
            border-radius:40px;
            background:#f1f5f9; border:1.5px solid #dce8f8;
            cursor:pointer; transition:.2s;
            white-space:nowrap;
        }
        .user-chip:hover{
            background:#dbeafe; border-color:#2563eb;
            transform:translateY(-2px);
        }

        .chip-avatar{
            width:25px; height:25px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            color:white; font-size:.7rem; font-weight:800;
        }
        .chip-name{ font-size:.73rem; font-weight:700; color:#07183a; }

        /* WELCOME */
        .welcome{
            position:relative; z-index:5;
            margin-right:7vw; color:white; text-align:right;
        }
        .welcome h1{
            font-family:'Syne',sans-serif; font-size:6rem; line-height:.9;
        }
        .welcome p{
            margin-top:15px; max-width:260px; margin-left:auto;
            color:rgba(255,255,255,.7); line-height:1.6;
        }

        @media(max-width:950px){
            body{ justify-content:center; }
            .welcome{ display:none; }
            .login-panel{ margin-left:0; }
        }
    </style>
</head>

<body>

<div class="bg-wrap">
    <div class="bg-blob"></div>
    <div class="bg-glow"></div>
</div>

<nav class="topbar">
    <a href="#">Inicio</a>
    <a href="#">Soporte</a>
    <a href="#" class="top-btn">SIGN IN</a>
</nav>

<div class="login-panel">

    <!-- BRAND -->
    <div class="brand">
        <div class="brand-icon">SP</div>
        <div class="brand-name">Saber <span>Pro</span> &amp; TYT</div>
    </div>

    <!-- AVATAR -->
    <div class="avatar" id="avatar">?</div>

    <!-- TITULOS -->
    <div class="title">Iniciar sesión</div>
    <div class="subtitle">Sistema de Gestión Académica</div>

    <!-- ERROR -->
    <div th:if="${error}" class="alert alert-error">
        <span th:text="${error}"></span>
    </div>

    <!-- LOGOUT -->
    <div th:if="${param.logout}" class="alert alert-success">
        Sesión cerrada correctamente
    </div>

    <!-- FORM -->
    <form action="/login" method="post">

        <div class="group">
            <label>Usuario</label>
            <div class="input-wrap">
                <input type="text"
                       name="username"
                       id="username"
                       placeholder="Ingrese usuario"
                       required>
            </div>
        </div>

        <div class="group">
            <label>Contraseña</label>
            <div class="input-wrap">
                <input type="password"
                       name="password"
                       id="password"
                       placeholder="Ingrese contraseña"
                       required>
                <button type="button" class="eye-btn" onclick="togglePassword()" title="Mostrar/ocultar">
                    👁
                </button>
            </div>
        </div>

        <button type="submit" class="btn">Ingresar al sistema</button>

    </form>

    <!-- DIVIDER -->
    <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-text">ACCESO RÁPIDO</div>
        <div class="divider-line"></div>
    </div>

    <!-- USUARIOS — scroll horizontal -->
    <div class="users-scroll">
        <div class="users-grid">

            <div th:each="u : ${usuarios}"
                 class="user-chip"
                 th:attr="data-username=${u.username}, data-nombre=${u.nombre}, data-password=${u.password}"
                 onclick="selectUser(this.dataset.username, this.dataset.nombre, this.dataset.password)">

                <div class="chip-avatar"
                     th:attr="style=${'background:' + colores[u.id]}">
                    <span th:text="${#strings.substring(u.nombre,0,1)}"></span>
                </div>

                <div class="chip-name">
                    <span th:text="${u.nombre}"></span>
                </div>

            </div>

        </div>
    </div>

</div>

<!-- WELCOME -->
<div class="welcome">
    <h1>Welcome.</h1>
    <p>
        Gestiona estudiantes, docentes,
        resultados y pruebas Saber Pro
        desde un solo lugar.
    </p>
</div>

<script>
    function selectUser(username, nombre, password) {
        document.getElementById("username").value = username;
        document.getElementById("password").value = password;
        document.getElementById("avatar").innerHTML = nombre.charAt(0).toUpperCase();

        // mostrar campo contraseña brevemente
        var pwInput = document.getElementById("password");
        pwInput.type = "text";
        setTimeout(function(){ pwInput.type = "password"; }, 1500);
    }

    function togglePassword() {
        var pwInput = document.getElementById("password");
        pwInput.type = pwInput.type === "password" ? "text" : "password";
    }
</script>

</body>
</html>
